{{ define "main" }}

{{ $pages := where site.RegularPages "Section" "blog" }}

{{ range $pages.ByDate.Reverse }}
<article>
  <h2>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </h2>

  <p>
    <time datetime="{{ .Date.Format "2006-01-02" }}">
      {{ .Date.Format "2006-01-02" }}
    </time>
  </p>

  {{ .Content }}
</article>
<hr>
{{ end }}

{{ end }}

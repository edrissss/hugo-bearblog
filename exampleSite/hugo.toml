
baseURL = "https://edrissss.github.io/hugo-bearblog/"

theme = 'hugo-bearblog'

title = "Edris"
author = "Edris"
copyright = "© Edris"
languageCode = "fa"
defaultContentLanguage = "fa"

enableRobotsTXT = true

disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  blog = "/:slug/"
  tags = "/blog/:slug"

[params]
  description = "وبلاگ شخصی ادریس"
  title = "Edris"
  dateFormat = "2006-01-02"

  favicon = "images/favicon.png"
  images = ["images/share.png"]

[markup]
  [markup.highlight]
    style = 'friendly'
    lineNos = true
    lineNumbersInTable = false
    codeFences = true
